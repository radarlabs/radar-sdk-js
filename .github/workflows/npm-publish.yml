name: Publish packages to npmjs

on:
  release:
    types: [released, prereleased]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --force

      - name: Build core package
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Publish core package to npm
        if: startsWith(github.ref_name, 'v')
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm run check-beta-tag
            npm publish --tag beta
          else
            npm run check-latest-tag
            npm publish
          fi

      - name: Parse core release tag
        if: startsWith(github.ref_name, 'v')
        run: echo "MAJOR_VERSION=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_ENV"

      - name: Upload core CDN for release tag
        if: startsWith(github.ref_name, 'v')
        uses: jakejarvis/s3-sync-action@master
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: 'cdn/'
          DEST_DIR: ${{ github.ref_name }}

      - name: Set core CDN major destination
        if: startsWith(github.ref_name, 'v') && !github.event.release.prerelease
        run: |
          echo "SOURCE_DIR=cdn/" >> "$GITHUB_ENV"
          echo "DEST_DIR=$MAJOR_VERSION" >> "$GITHUB_ENV"

      - name: Upload core CDN for latest major version
        if: startsWith(github.ref_name, 'v') && !github.event.release.prerelease
        uses: jakejarvis/s3-sync-action@master
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'

      - name: Publish docs site
        if: startsWith(github.ref_name, 'v') && !github.event.release.prerelease
        run: npm run compile-site

      - name: Deploy docs site
        if: startsWith(github.ref_name, 'v') && !github.event.release.prerelease
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Parse plugin release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_NAME="${TAG%-v*}"
          PLUGIN_VERSION="${TAG#*-v}"
          MAJOR_VERSION="${PLUGIN_VERSION%%.*}"
          echo "PLUGIN_NAME=$PLUGIN_NAME" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=packages/$PLUGIN_NAME/cdn/" >> "$GITHUB_ENV"
          echo "DEST_DIR=$PLUGIN_NAME/v$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "Parsed tag: plugin=$PLUGIN_NAME version=$PLUGIN_VERSION major=$MAJOR_VERSION"

      - name: Build plugin package
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: npm run "build:$PLUGIN_NAME"

      - name: Publish plugin package to npm
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            node scripts/check-plugin-tag.cjs "$PLUGIN_NAME" "$PLUGIN_VERSION" beta
            npm publish -w "packages/$PLUGIN_NAME" --tag beta
          else
            node scripts/check-plugin-tag.cjs "$PLUGIN_NAME" "$PLUGIN_VERSION" stable
            npm publish -w "packages/$PLUGIN_NAME"
          fi

      - name: Upload plugin CDN for release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: jakejarvis/s3-sync-action@master
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'

      - name: Set plugin CDN major destination
        if: ${{ !startsWith(github.ref_name, 'v') && !github.event.release.prerelease }}
        run: echo "DEST_DIR=$PLUGIN_NAME/$MAJOR_VERSION" >> "$GITHUB_ENV"

      - name: Upload plugin CDN for latest major version
        if: ${{ !startsWith(github.ref_name, 'v') && !github.event.release.prerelease }}
        uses: jakejarvis/s3-sync-action@master
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
