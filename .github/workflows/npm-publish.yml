name: Publish packages to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and test
        run: |
          npm ci --force
          npm run build
          npm run test

      # core
      - name: Publish core package to npm
        if: startsWith(github.ref_name, 'v')
        run: |
          npm run check-latest-tag
          npm publish

      - name: Parse core release tag
        if: startsWith(github.ref_name, 'v')
        run: echo "MAJOR_VERSION=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_ENV"

      - name: Upload core CDN for release tag
        if: startsWith(github.ref_name, 'v')
        # Pin third-party action SHAs because this step receives AWS credentials.
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: 'cdn/'
          DEST_DIR: ${{ github.ref_name }} # release tag

      - name: Upload core CDN for latest major version
        if: startsWith(github.ref_name, 'v')
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: 'cdn/'
          DEST_DIR: ${{ env.MAJOR_VERSION }} # release latest major version

      # plugins
      - name: Parse plugin release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          TAG="${{ github.ref_name }}"
          PLUGIN_NAME="${TAG%-v*}"
          PLUGIN_VERSION="${TAG#*-v}"
          MAJOR_VERSION="${PLUGIN_VERSION%%.*}"
          echo "PLUGIN_NAME=$PLUGIN_NAME" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> "$GITHUB_ENV"
          echo "Parsed tag: plugin=$PLUGIN_NAME version=$PLUGIN_VERSION major=$MAJOR_VERSION"

      - name: Build plugin package
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: npm run "build:${{ env.PLUGIN_NAME }}"

      - name: Publish plugin package to npm
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          node scripts/check-plugin-tag.cjs "${{ env.PLUGIN_NAME }}" "${{ env.PLUGIN_VERSION }}" stable
          npm publish -w "packages/${{ env.PLUGIN_NAME }}"

      - name: Upload plugin CDN for release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: packages/${{ env.PLUGIN_NAME }}/cdn/
          DEST_DIR: ${{ env.PLUGIN_NAME }}/v${{ env.PLUGIN_VERSION }}

      - name: Upload plugin CDN for latest major version
        if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: packages/${{ env.PLUGIN_NAME }}/cdn/
          DEST_DIR: ${{ env.PLUGIN_NAME }}/${{ env.MAJOR_VERSION }}

  deploy-docs:
    if: ${{ !github.event.release.prerelease && startsWith(github.ref_name, 'v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build docs site
        run: |
          npm ci --force
          npm run compile-site

      - name: Deploy docs site
        # Pin third-party action SHAs rather than mutable tags.
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  publish-beta:
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and test
        run: |
          npm ci --force
          npm run build
          npm run test

      # core
      - name: Publish core package to npm
        if: startsWith(github.ref_name, 'v')
        run: |
          npm run check-beta-tag
          npm publish --tag beta

      - name: Upload core CDN for release tag
        if: startsWith(github.ref_name, 'v')
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: 'cdn/'
          DEST_DIR: ${{ github.ref_name }} # release tag

      # plugins
      - name: Parse plugin release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          TAG="${{ github.ref_name }}"
          PLUGIN_NAME="${TAG%-v*}"
          PLUGIN_VERSION="${TAG#*-v}"
          MAJOR_VERSION="${PLUGIN_VERSION%%.*}"
          echo "PLUGIN_NAME=$PLUGIN_NAME" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "Parsed tag: plugin=$PLUGIN_NAME version=$PLUGIN_VERSION major=$MAJOR_VERSION"

      - name: Build plugin package
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: npm run "build:${{ env.PLUGIN_NAME }}"

      - name: Publish plugin package to npm
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          node scripts/check-plugin-tag.cjs "${{ env.PLUGIN_NAME }}" "${{ env.PLUGIN_VERSION }}" beta
          npm publish -w "packages/${{ env.PLUGIN_NAME }}" --tag beta

      - name: Upload plugin CDN for release tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311
        env:
          AWS_S3_BUCKET: js.radar.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: packages/${{ env.PLUGIN_NAME }}/cdn/
          DEST_DIR: ${{ env.PLUGIN_NAME }}/v${{ env.PLUGIN_VERSION }}
